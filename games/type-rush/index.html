<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Rush</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="game-header">
        <a href="../../index.html" class="btn-back">⬅ Back to Hub</a>
        <div class="game-stats">
            <div>Level: <span id="ui-level">1</span></div>
            <div>⏱️ WPM: <span id="ui-wpm" style="color: var(--secondary);">0</span></div>
            <div>Score: <span id="ui-score">0</span></div>
        </div>
    </header>

    <main class="game-area">
        <div class="typing-container">
            <p id="prompt-text" class="prompt-text">Loading...</p>
        </div>
        
        <button id="toggle-kb-btn" class="btn btn-secondary btn-small" style="margin-bottom: 1rem; display: none;">Hide Keyboard</button>

        <div id="virtual-keyboard" class="virtual-keyboard hidden">
            <div class="keyboard-row">
                <div class="key l-pinky" id="key-q">Q</div><div class="key l-ring" id="key-w">W</div><div class="key l-mid" id="key-e">E</div><div class="key l-index" id="key-r">R</div><div class="key l-index" id="key-t">T</div>
                <div class="key r-index" id="key-y">Y</div><div class="key r-index" id="key-u">U</div><div class="key r-mid" id="key-i">I</div><div class="key r-ring" id="key-o">O</div><div class="key r-pinky" id="key-p">P</div>
            </div>
            <div class="keyboard-row">
                <div class="key l-pinky" id="key-a">A</div><div class="key l-ring" id="key-s">S</div><div class="key l-mid" id="key-d">D</div><div class="key l-index" id="key-f">F</div><div class="key l-index" id="key-g">G</div>
                <div class="key r-index" id="key-h">H</div><div class="key r-index" id="key-j">J</div><div class="key r-mid" id="key-k">K</div><div class="key r-ring" id="key-l">L</div>
            </div>
            <div class="keyboard-row">
                <div class="key l-pinky" id="key-z">Z</div><div class="key l-ring" id="key-x">X</div><div class="key l-mid" id="key-c">C</div><div class="key l-index" id="key-v">V</div><div class="key l-index" id="key-b">B</div>
                <div class="key r-index" id="key-n">N</div><div class="key r-index" id="key-m">M</div>
            </div>
            <div class="keyboard-row">
                <div class="key spacebar thumbs" id="key- ">THUMB (SPACE)</div>
            </div>
            
            <div class="hand-guide-legend">
                <p>Feel the bumps on <strong>F</strong> and <strong>J</strong>. That is where your index fingers live.</p>
                <div class="color-legend">
                    <span style="color: #ff7675;">Pinky</span>
                    <span style="color: #74b9ff;">Ring</span>
                    <span style="color: #55efc4;">Middle</span>
                    <span style="color: #ffeaa7;">Index</span>
                </div>
            </div>
        </div>
        
        <div id="mobile-input-container" class="mobile-input-container hidden">
            <input type="text" id="mobile-input" placeholder="Tap here to open keyboard and type!" autocomplete="off" spellcheck="false">
        </div>
    </main>

    <div id="game-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 id="modal-title">Title</h2>
            <div id="modal-message">Message</div>
            <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem;">
                <button id="modal-btn-primary" class="btn">Action</button>
                <button id="modal-btn-secondary" class="btn btn-secondary">Abort to Hub</button>
            </div>
        </div>
    </div>

    <script src="../../js/main.js"></script>
    <script src="../../js/BaseGame.js"></script>
    <script src="type-rush.js"></script>
</body>
</html>
